  <!-- ── 页面打开统计（尽早执行，避免用户离开前未上报）──── -->
  <script>
  (function () {
    var ENDPOINT = 'https://script.google.com/macros/s/AKfycbzSD362gcahdmKAWhiYyiPfEXeYnm0SXfBsTJIKx1g7pkMTogd7EtG0O59Gs_rEsX8/exec';
    window.__CS_STATS_ENDPOINT = ENDPOINT;

    /* 客户代码：?client=hotel_xxx → 统计 page=cs-hotel_xxx（长期复用） */
    var _qs = new URLSearchParams(location.search);
    var _clientRaw = (_qs.get('client') || '').toLowerCase();
    var _client = _clientRaw.replace(/[^a-z0-9_-]/g, '').slice(0, 48);
    window.__CS_CLIENT = _client;
    var _page = _client ? ('cs-' + _client) : 'booking-cs';

    window.__csTrack = function (opts) {
      if (!ENDPOINT) return;
      opts = opts || {};
      var parts = [
        'action=' + encodeURIComponent(opts.action || 'hit'),
        'page=' + encodeURIComponent(_page),
        'lang=' + encodeURIComponent(document.documentElement.lang || 'en')
      ];
      if (_client) parts.push('client=' + encodeURIComponent(_client));
      if (opts.action === 'hit' || !opts.action) {
        var title = opts.title || document.title || '';
        if (_client && title.indexOf(_client) < 0) title = (_client + ' · ' + title);
        parts.push('title=' + encodeURIComponent(String(title).slice(0, 120)));
      }
      if (opts.btn) parts.push('btn=' + encodeURIComponent(String(opts.btn).slice(0, 64)));
      if (opts.label) parts.push('label=' + encodeURIComponent(String(opts.label).slice(0, 120)));
      new Image().src = ENDPOINT + '?' + parts.join('&');
    };

    /* 本地关闭 PV 打点（恢复时取消下一行注释） */
    // __csTrack({ action: 'hit' });
  })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f0f4f3;
      --surface:  #ffffff;
      --ink:      #14221f;
      --sub:      #4e6560;
      --muted:    #8fa39e;
      --line:     #e2ebe8;
      --brand:    #0f766e;
      --brand-dk: #134e4a;
      --tag-bg:   #e2efed;
      --radius:   14px;
      --safe-b:   max(1rem, env(safe-area-inset-bottom));
    }

    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      padding-bottom: calc(4.5rem + var(--safe-b));
    }

    /* ══════════════════════════════════════════
       HERO  — 地图背景版
    ══════════════════════════════════════════ */
    .hero {
      position: relative;
      border-radius: 0 0 26px 26px;
      overflow: hidden;
      /* 地图加载前的过渡底色 */
      background: #dde8e4;
      min-height: 210px;
    }

    /* 地图背景层 */
    .hero-map {
      position: absolute; inset: 0; z-index: 0;
      overflow: hidden;
    }
    /* 用 img + object-fit:cover 保持原图清晰度
       参考坐标：東山区清閑院蛤屋町394-4
       lat: 35.01021, lon: 135.77801
    */
    .hero-map img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      /* 地图截图中该坐标约在图片 45% 宽 / 30% 高处 */
      object-position: 45% 30%;
    }

    /* 渐变遮罩：顶部透明展示地图，底部半磨砂承载文字 */
    .hero-veil {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(
        to bottom,
        rgba(245,249,247,.08)  0%,
        rgba(245,249,247,.45) 38%,
        rgba(245,249,247,.82) 62%,
        rgba(245,249,247,.96) 100%
      );
    }

    /* 文字内容层 */
    .hero-inner {
      position: relative; z-index: 2;
      padding: 1.1rem 1.25rem 1.55rem;
      /* 文字推到下半部分，上半部分留给地图 */
      display: flex; flex-direction: column;
      justify-content: flex-end; min-height: 210px;
    }

    /* 顶行：位置按钮 + 语言切换（绝对定位在顶部） */
    .hero-top {
      position: absolute; top: 1rem; left: 1.25rem; right: 1.25rem;
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: .6rem;
    }
    /* ── 位置选择按钮 ──────────────────────────────── */
    .loc-btn {
      display: inline-flex; align-items: center; gap: .32rem;
      padding: .28rem .5rem;
      background: var(--brand);
      backdrop-filter: blur(8px);
      border: 1.5px solid var(--brand);
      border-radius: 8px;
      font-size: .72rem; font-weight: 600;
      color: #fff; cursor: pointer;
      max-width: 70vw; white-space: nowrap; overflow: hidden;
      font-family: inherit; line-height: 1.4;
      transition: background .15s, border-color .15s;
    }
    .loc-btn:hover, .loc-btn:active { background: var(--brand-dk); border-color: var(--brand-dk); }
    .loc-btn .loc-pin {
      flex-shrink: 0; width: 14px; height: 14px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .loc-btn .loc-label {
      flex: 1; overflow: hidden; text-overflow: ellipsis;
      min-width: 0; color: #fff;
    }
    .loc-btn .loc-chevron {
      flex-shrink: 0; width: 12px; height: 12px;
      color: rgba(255,255,255,.7); transition: transform .2s;
    }
    .loc-btn.dirty .loc-label { color: #fff; font-weight: 700; }

    /* ── 地址选择抽屉 ────────────────────────────────── */
    .loc-drawer-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 200; animation: fadeIn 200ms;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .loc-drawer-mask.hidden { display: none; }
    .loc-drawer {
      width: 100%; max-width: 480px; max-height: 85dvh;
      background: #fff; border-radius: 16px 16px 0 0;
      display: flex; flex-direction: column;
      animation: slideUp 280ms ease-out;
      overflow: hidden;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .loc-drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: .9rem 1rem; border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .loc-drawer-head h3 { font-size: .95rem; font-weight: 700; }
    .loc-drawer-close {
      appearance: none; border: none; background: transparent;
      font-size: 1.3rem; color: var(--muted); cursor: pointer;
      padding: .25rem; line-height: 1;
    }
    .loc-drawer-body { flex: 1; overflow-y: auto; padding: .75rem 1rem 1.5rem; }

    /* 自动定位按钮 */
    .loc-current-btn {
      display: flex; align-items: center; gap: .5rem;
      width: 100%; padding: .7rem .85rem;
      background: var(--brand); color: #fff;
      border: none; border-radius: 10px;
      font-size: .84rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
      margin-bottom: .85rem; transition: background .15s;
    }
    .loc-current-btn:hover { background: var(--brand-dk); }
    .loc-current-btn:disabled { opacity: .5; cursor: not-allowed; }
    .loc-current-btn svg { flex-shrink: 0; }

    /* 搜索栏 */
    .loc-search-row {
      display: flex; align-items: center; gap: .4rem;
      background: var(--bg); border: 1.5px solid var(--line);
      border-radius: 10px; padding: 0 .65rem;
      margin-bottom: .6rem; transition: border-color .18s;
    }
    .loc-search-row:focus-within { border-color: var(--brand); background: #fff; }
    .loc-search-row input {
      flex: 1; border: none; background: transparent;
      padding: .55rem 0; font-size: .84rem;
      color: var(--ink); outline: none; font-family: inherit;
    }
    .loc-search-row input::placeholder { color: var(--muted); }

    /* 建议列表 */
    .loc-suggestions { display: flex; flex-direction: column; }
    .loc-suggestion {
      display: flex; align-items: flex-start; gap: .55rem;
      padding: .65rem .2rem; border-bottom: 1px solid var(--line);
      cursor: pointer; font-size: .8rem; line-height: 1.45;
      transition: background .1s;
    }
    .loc-suggestion:hover { background: var(--bg); }
    .loc-suggestion:last-child { border-bottom: none; }
    .loc-suggestion .loc-sug-pin {
      flex-shrink: 0; width: 16px; height: 16px; margin-top: 1px;
      color: var(--muted);
    }
    .loc-suggestion .loc-sug-name { color: var(--muted); font-size: .73rem; margin-top: 1px; }
    .loc-suggestion .loc-sug-addr { font-weight: 600; color: var(--ink); }
    .loc-suggestion-current { background: rgba(15,118,110,.06); border-radius: 8px; padding: .65rem .55rem; margin: 0 -.35rem; }
    .loc-nearby-sep { font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: .85rem .2rem .35rem; }
    .loc-empty { text-align: center; color: var(--muted); padding: 1.5rem 0; font-size: .8rem; }
    .loc-loading { text-align: center; color: var(--muted); padding: 1rem 0; font-size: .8rem; }

    /* 民宿名徽章已合并进距离说明行，元素保留但不渲染 */
    .prop-badge { display: none; }

    /* 标题 — 深绿，衬线，单行 */
    .hero h1 {
      font-family: "Noto Serif SC", "Noto Serif JP", serif;
      font-size: 1.48rem; font-weight: 700;
      line-height: 1.2; letter-spacing: .02em;
      color: var(--brand-dk); /* 深品牌绿，比纯黑柔和 */
      white-space: nowrap;
    }
    html[lang="en"] .hero h1 {
      font-size: 1.22rem; white-space: normal;
    }
    html[lang="ja"] .hero h1 {
      font-size: 1.28rem; white-space: normal;
    }
    /* booking-cs：eyebrow 较长，hero 需要更多高度避免内容贴顶 */
    .hero { min-height: 220px; }
    .hero-inner { min-height: 220px; }
    .hero-rule {
      width: 2rem; height: 2px; border-radius: 2px;
      background: var(--brand);
      margin: .85rem 0;
    }
    .hero-lead {
      font-size: .84rem; color: var(--sub);
      line-height: 1.6; max-width: 26em;
    }
    .hero-dist-note {
      margin-top: .5rem; font-size: .72rem;
      color: var(--brand); font-weight: 500;
    }
    /* 本页由客服发送给已预订客人：不展示「以民宿为起点」的距离说明 */
    #i-dnote { display: none !important; }

    /* 语言切换 — 毛玻璃胶囊 */
    .lang-sw { display: flex; gap: .15rem; flex-shrink: 0; }
    .lang-sw button {
      appearance: none;
      border: 1.5px solid rgba(20,34,31,.15);
      background: rgba(255,255,255,.78);
      color: var(--sub);
      font-size: .6rem; font-weight: 700;
      padding: .25rem .42rem; border-radius: 6px;
      cursor: pointer; font-family: inherit;
      backdrop-filter: blur(8px);
    }
    .lang-sw button.on {
      background: var(--ink); color: #fff;
      border-color: var(--ink);
    }

    /* ══════════════════════════════════════════
       STICKY CONTROLS — 搜索栏 + 分类胶囊
    ══════════════════════════════════════════ */
    .controls {
      position: sticky; top: 0; z-index: 100;
      background: rgba(240,244,243,.97);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: .55rem 1.1rem 0;
    }

    /* 搜索栏 */
    .search-row { margin-bottom: .5rem; }
    .search-box {
      display: flex; align-items: center; gap: .4rem;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 11px; padding: 0 .72rem;
      transition: border-color .18s;
    }
    .search-box:focus-within { border-color: var(--brand); }
    .s-ico { color: var(--muted); flex-shrink: 0; display: flex; }
    .search-box input {
      flex: 1; border: none; background: transparent;
      padding: .52rem 0; font-size: .86rem;
      color: var(--ink); outline: none; font-family: inherit;
    }
    .search-box input::placeholder { color: var(--muted); }
    .clear-btn {
      appearance: none; border: none; background: transparent;
      color: var(--muted); cursor: pointer; padding: .25rem;
      display: flex; align-items: center;
    }

    /* 分类胶囊 */
    .chips {
      display: flex; gap: .3rem; overflow-x: auto;
      padding-bottom: .5rem; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; white-space: nowrap;
      padding: .33rem .72rem; border-radius: 999px;
      font-size: .76rem;
      border: 1.5px solid var(--line);
      background: var(--surface); color: var(--sub);
      cursor: pointer; font-family: inherit;
    }
    .chip.on {
      background: var(--brand); border-color: var(--brand);
      color: #fff; font-weight: 600;
    }
    /* 探索引导：未点过的分类胶囊描边呼吸动效 */
    .chip.hint:not(.on) {
      border-color: var(--brand);
      color: var(--brand);
      box-shadow: 0 0 0 0 rgba(15, 118, 110, .35);
      animation: chipHintPulse 1.7s ease-in-out infinite;
    }
    @keyframes chipHintPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(15, 118, 110, .38);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 5px rgba(15, 118, 110, .12);
        transform: scale(1.04);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .chip.hint:not(.on) { animation: none; box-shadow: 0 0 0 3px rgba(15, 118, 110, .2); }
    }

    /* 探索奖励优惠券：右下角浮层 */
    .coupon-toast {
      position: fixed;
      right: max(.75rem, env(safe-area-inset-right));
      bottom: calc(4.6rem + var(--safe-b));
      z-index: 250;
      width: min(292px, calc(100vw - 1.5rem));
      padding: 1rem 1rem .9rem;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 12px 36px rgba(20, 34, 31, .16);
      transform: translateY(12px) scale(.96);
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease, transform .28s ease;
    }
    .coupon-toast.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .coupon-close {
      position: absolute; top: .45rem; right: .5rem;
      width: 28px; height: 28px; border: none; border-radius: 8px;
      background: transparent; color: var(--muted); cursor: pointer;
      font-size: .9rem; line-height: 1;
    }
    .coupon-eyebrow {
      margin: 0 1.4rem 0 0;
      font-size: .68rem; font-weight: 700; letter-spacing: .04em;
      color: var(--brand); text-transform: uppercase;
    }
    .coupon-title {
      margin: .28rem 1.2rem .35rem 0;
      font-size: .95rem; font-weight: 700; color: var(--ink);
      line-height: 1.35;
    }
    .coupon-desc {
      margin: 0 0 .7rem;
      font-size: .72rem; color: var(--sub); line-height: 1.45;
    }
    .coupon-code {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: .75rem; padding: .55rem .7rem;
      border-radius: 10px;
      background: rgba(15, 118, 110, .08);
      border: 1.5px dashed rgba(15, 118, 110, .35);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.05rem; font-weight: 700; letter-spacing: .08em;
      color: var(--brand-dk);
    }
    .coupon-actions {
      display: flex; flex-direction: column; gap: .4rem;
    }
    .coupon-copy {
      width: 100%; padding: .62rem .7rem; border-radius: 10px;
      border: none; cursor: pointer; font-family: inherit;
      font-size: .8rem; font-weight: 700; color: #fff;
      background: var(--brand);
    }
    .coupon-copy.ok { background: var(--brand-dk); }
    .coupon-wa {
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: .58rem .7rem; border-radius: 10px;
      border: 1.5px solid var(--brand); text-decoration: none;
      font-size: .78rem; font-weight: 650; color: var(--brand);
      background: transparent; box-sizing: border-box;
    }
    /* 已领券后的常驻入口：再次打开复制 */
    .coupon-entry {
      display: none;
      position: fixed;
      right: max(.75rem, env(safe-area-inset-right));
      bottom: calc(4.6rem + var(--safe-b));
      z-index: 240;
      align-items: center; gap: .35rem;
      padding: .55rem .85rem;
      border-radius: 999px;
      border: 1.5px solid var(--brand);
      background: #fff;
      color: var(--brand);
      font-family: inherit;
      font-size: .78rem; font-weight: 700;
      box-shadow: 0 8px 22px rgba(20, 34, 31, .12);
      cursor: pointer;
    }
    .coupon-entry.show { display: inline-flex; }
    .coupon-entry:active { background: rgba(15, 118, 110, .06); }

    /* 排序按钮行 */
    .sort-row {
      display: flex; align-items: center; gap: .3rem;
      overflow-x: auto; padding-bottom: .5rem;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .sort-row::-webkit-scrollbar { display: none; }
    .sort-lbl {
      flex: 0 0 auto; font-size: .68rem; color: var(--muted);
      display: inline-flex; align-items: center; gap: .2rem;
    }
    .sort-btn {
      flex: 0 0 auto; white-space: nowrap;
      display: inline-flex; align-items: center; gap: .25rem;
      padding: .24rem .6rem; border-radius: 999px;
      font-size: .7rem;
      border: 1.5px solid transparent;
      background: transparent; color: var(--muted);
      cursor: pointer; font-family: inherit;
    }
    .sort-btn.on {
      background: var(--tag-bg); color: var(--brand);
      border-color: rgba(15,118,110,.25); font-weight: 600;
    }
    .sort-btn:disabled { opacity: .6; cursor: default; }

    /* ══════════════════════════════════════════
       CARDS — 参照示例图：左图右文
    ══════════════════════════════════════════ */
    .cards {
      padding: .85rem 1rem .5rem;
      display: flex; flex-direction: column; gap: .72rem;
    }

    .card {
      display: flex; align-items: stretch;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: 0 2px 14px rgba(20,34,31,.05);
    }

    /* 左侧图片区 */
    .card-img-wrap {
      width: 96px; flex-shrink: 0;
      position: relative; overflow: hidden;
    }
    /* 图片加载失败时的渐变兜底 */
    .card[data-cat="spa"]      .card-img-wrap { background: linear-gradient(160deg,#c9b3d4,#8a62a8); }
    .card[data-cat="dining"]   .card-img-wrap { background: linear-gradient(160deg,#e8c090,#c47840); }
    .card[data-cat="transfer"] .card-img-wrap { background: linear-gradient(160deg,#96c4d8,#5080a0); }
    .card[data-cat="whisky"]   .card-img-wrap { background: linear-gradient(160deg,#d4b880,#906030); }
    .card[data-cat="kimono"]   .card-img-wrap { background: linear-gradient(160deg,#e8afc4,#b86090); }

    .card-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    /* 右侧内容区 */
    .card-body {
      flex: 1; min-width: 0;
      padding: .7rem .85rem .65rem;
      display: flex; flex-direction: column; gap: .2rem;
    }

    .card-row1 {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: .3rem;
    }
    .card-name {
      font-size: .93rem; font-weight: 700;
      color: var(--ink); line-height: 1.2;
      flex: 1; min-width: 0;
    }
    .rec-badge {
      display: none; /* 暂时隐藏优惠标签，需要恢复时删掉这一行 */
      flex-shrink: 0;
      font-size: .58rem; font-weight: 700;
      color: #b45309; background: #fef3c7;
      border: 1px solid #fde68a;
      padding: .13rem .36rem; border-radius: 4px;
      white-space: nowrap; line-height: 1.4;
    }


    .card-desc {
      font-size: .78rem; color: var(--sub); line-height: 1.42;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }

    .card-tags {
      display: flex; flex-wrap: wrap; gap: .2rem; margin-top: .06rem;
    }
    .tag {
      font-size: .62rem; font-weight: 500;
      padding: .13rem .38rem;
      background: var(--tag-bg); color: var(--brand);
      border-radius: 999px; white-space: nowrap;
    }

    .card-footer {
      display: flex; align-items: center;
      justify-content: space-between; gap: .3rem;
      margin-top: auto; padding-top: .3rem; flex-wrap: wrap;
    }
    .card-hours {
      display: flex; align-items: center; gap: .24rem;
      font-size: .7rem; color: var(--muted);
    }

    /* 预约按钮 — 清淡绿胶囊，固定在右侧 */
    .book-btn {
      display: inline-flex; align-items: center; gap: .22rem;
      background: #f0fdf4;
      color: #15803d;
      border: 1.5px solid rgba(21,128,61,.28);
      border-radius: 999px;
      padding: .3rem .62rem;
      font-size: .72rem; font-weight: 700;
      cursor: pointer; font-family: inherit; white-space: nowrap;
      margin-left: auto; /* 换行时仍保持靠右 */
    }

    /* ── WhatsApp 预约弹层 ──────────────────────────────── */
    .wa-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.45);
      align-items: flex-end; justify-content: center;
    }
    .wa-overlay.open { display: flex; }
    .wa-sheet {
      background: var(--surface); width: 100%; max-width: 480px;
      border-radius: 22px 22px 0 0;
      padding: 1.35rem 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      box-shadow: 0 -8px 40px rgba(0,0,0,.15);
    }
    .wa-sheet-head {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 1rem; gap: .5rem;
    }
    .wa-store-name {
      font-size: .95rem; font-weight: 800; color: var(--ink);
      line-height: 1.3; flex: 1;
    }
    .wa-close {
      appearance: none; border: 1px solid var(--line); border-radius: 7px;
      background: var(--bg); color: var(--muted); font-size: .75rem;
      padding: .25rem .45rem; cursor: pointer; font-family: inherit;
      flex-shrink: 0;
    }
    .wa-fields {
      display: grid; grid-template-columns: 1fr 1fr; gap: .55rem;
      margin-bottom: .9rem;
    }
    .wa-field { display: flex; flex-direction: column; gap: .22rem; }
    .wa-field label {
      font-size: .72rem; font-weight: 600; color: var(--muted);
    }
    .wa-field input {
      padding: .48rem .65rem; border: 1.5px solid var(--line);
      border-radius: 9px; font-size: .86rem;
      font-family: inherit; color: var(--ink); outline: none;
    }
    .wa-field input:focus { border-color: var(--brand); }
    .wa-submit {
      width: 100%; padding: .8rem; border-radius: 12px; border: none;
      cursor: pointer; font-family: inherit; font-size: .9rem; font-weight: 800;
      color: #fff; background: #25D366;
      display: flex; align-items: center; justify-content: center; gap: .4rem;
      box-shadow: 0 6px 18px rgba(37,211,102,.28);
    }

    /* ── 渠道选择 ─────────────────────────────────────────── */
    .plat-row { display: flex; gap: .4rem; margin-bottom: .85rem; }
    .plat-btn {
      flex: 1; padding: .42rem .2rem; border-radius: 9px;
      border: 1.5px solid var(--line); background: var(--bg); color: var(--muted);
      font-size: .74rem; font-weight: 700; cursor: pointer;
      font-family: inherit; line-height: 1.3; text-align: center;
    }
    .plat-badge { display: block; font-size: .6rem; font-weight: 600; opacity: .7; }
    .plat-btn.on[data-plat="whatsapp"]{ border-color:#25D366; color:#1a9e52; background:#f0fdf4; }
    .plat-btn.on[data-plat="line"]    { border-color:#00B900; color:#007a00; background:#f0fff0; }
    .plat-btn.on[data-plat="wechat"]  { border-color:#07C160; color:#058549; background:#f0fdf8; }

    /* ── 消息预览 & 操作 ──────────────────────────────────── */
    .plat-act { display: none; }
    .plat-act.on { display: block; }
    .act-hint { font-size: .78rem; color: var(--muted); margin-bottom: .4rem; line-height: 1.5; }
    .msg-box {
      width: 100%; height: 105px; border: 1.5px solid var(--line); border-radius: 9px;
      padding: .58rem .72rem; font-size: .77rem; font-family: inherit;
      color: var(--ink); resize: none; background: var(--bg);
      line-height: 1.55; margin-bottom: .5rem;
    }
    .act-btns { display: flex; gap: .4rem; }
    .copy-btn {
      flex: 1; padding: .62rem; border-radius: 10px;
      border: 1.5px solid var(--line); background: var(--bg);
      font-size: .82rem; font-weight: 700; cursor: pointer; font-family: inherit;
      color: var(--ink);
    }
    .copy-btn.ok { border-color: var(--brand); color: var(--brand); }
    .link-btn {
      flex: 1.5; padding: .62rem; border-radius: 10px; border: none;
      font-size: .82rem; font-weight: 700; cursor: pointer; font-family: inherit;
      color: #fff; text-align: center; text-decoration: none;
      display: flex; align-items: center; justify-content: center;
    }
    .line-btn   { background: #00B900; }
    .wechat-btn { background: #07C160; }
    .qr-wrap { display: none; text-align: center; margin-top: .72rem; }
    .qr-wrap.show { display: block; }
    .qr-wrap img { width: 160px; border-radius: 12px; border: 1px solid var(--line); }
    .qr-wrap p { font-size: .72rem; color: var(--muted); margin-top: .35rem; }

    /* ══════════════════════════════════════════
       空结果 / 底部栏
    ══════════════════════════════════════════ */
    .no-results {
      text-align: center; padding: 3rem 1.5rem;
      font-size: .87rem; color: var(--muted);
    }
    .no-results.hidden { display: none; }
    .no-results .ask-link {
      display: block; margin: .7rem auto 0;
      background: none; border: none; cursor: pointer;
      color: var(--brand); font-size: .84rem; font-weight: 600;
      text-decoration: underline; text-underline-offset: 3px;
    }

    /* 底部「加入推荐清单」入口卡 */
    .join-card {
      border: 1.5px dashed var(--line);
      border-radius: var(--radius);
      padding: 1.4rem 1.2rem; text-align: center;
      background: transparent;
    }
    .join-card h3 { font-size: .92rem; font-weight: 700; }
    .join-card p  { font-size: .76rem; color: var(--muted); margin: .35rem 0 .85rem; }
    .join-btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .5rem 1.05rem; border-radius: 999px;
      border: 1px solid var(--brand); background: transparent;
      color: var(--brand); font-size: .8rem; font-weight: 600;
      cursor: pointer;
    }
    .join-btn:active { background: var(--brand); color: #fff; }

    .cta-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: .5rem 1.1rem var(--safe-b);
      background: rgba(240,244,243,.97);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
    }
    .cta-bar button {
      width: 100%; padding: .78rem; border-radius: 12px;
      border: none; cursor: pointer; font-family: inherit;
      font-size: .88rem; font-weight: 800; color: #fff;
      background: var(--brand);
      box-shadow: 0 8px 20px rgba(15,118,110,.22);
    }

    .page-footer {
      padding: 1.1rem 1.1rem .35rem;
      text-align: center;
    }
    .page-footer p {
      margin: 0;
      font-size: .68rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .page-footer a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ══════════════════════════════════════════
       桌面端：居中限宽 + 卡片栅格
    ══════════════════════════════════════════ */
    .page-main {
      max-width: 100%;
      margin: 0 auto;
    }

    @media (min-width: 720px) {
      body {
        font-size: 16px;
        padding-bottom: calc(5rem + var(--safe-b));
      }
      .hero {
        min-height: 260px;
        border-radius: 0 0 28px 28px;
      }
      .hero-inner { min-height: 260px; padding: 1.35rem 1.5rem 1.75rem; }
      .hero-top { top: 1.15rem; left: 1.5rem; right: 1.5rem; }
      .hero h1 { font-size: 1.75rem; }
      html[lang="en"] .hero h1 { font-size: 1.45rem; }
      .hero-lead { font-size: .9rem; max-width: 36em; }
      .page-main {
        max-width: 680px;
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }
      .controls { padding-left: 0; padding-right: 0; }
      .cards { padding-left: 0; padding-right: 0; }
      .card-img-wrap { width: 112px; }
      .card-body { padding: .85rem 1rem .75rem; }
      .card-name { font-size: 1rem; }
      .card-desc { -webkit-line-clamp: 3; font-size: .82rem; }
      .card-loc { font-size: .78rem; }
      .cta-bar {
        display: flex;
        justify-content: center;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
      .cta-bar button { max-width: 560px; }
    }

    @media (min-width: 1024px) {
      .page-main {
        max-width: 1080px;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
      .hero {
        min-height: 300px;
        border-radius: 0 0 32px 32px;
      }
      .hero-inner { min-height: 300px; }
      .hero h1 { font-size: 2rem; }
      html[lang="en"] .hero h1 { font-size: 1.65rem; }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem 1.1rem;
        padding-top: 1.1rem;
        padding-bottom: .75rem;
      }
      .card-img-wrap { width: 132px; }
      .card-body { padding: .95rem 1.05rem .85rem; }
      .join-card { grid-column: 1 / -1; }
    }

    @media (min-width: 1320px) {
      .page-main { max-width: 1200px; }
    }

    /* 地点行：图标 + 文案分列，避免长句在不合适位置断行 */
    .card-loc {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: start;
      column-gap: .35rem;
      margin-top: .04rem;
      font-size: .72rem;
    }
    .card-loc-ico {
      display: flex;
      padding-top: .1em;
      color: var(--brand);
    }
    .card-loc-txt { min-width: 0; }
    .card-loc-body {
      display: flex;
      flex-direction: column;
      gap: .22rem;
      min-width: 0;
      line-height: 1.45;
    }
    .card-loc-line1 {
      font-weight: 500;
      color: var(--brand);
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .card-loc-line2 {
      font-size: .94em;
      font-weight: 500;
      color: var(--sub);
      line-height: 1.4;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .card-loc-sep { font-weight: 500; color: var(--brand); opacity: .88; }

    /* ── 城市选择（首屏） ──────────────────────────────── */
    .city-picker-overlay {
      display: none; position: fixed; inset: 0; z-index: 400;
      background: rgba(20, 34, 31, .52);
      align-items: center; justify-content: center;
      padding: 1.25rem;
    }
    .city-picker-overlay.open { display: flex; }
    body.city-picker-lock { overflow: hidden; }
    .city-picker-sheet {
      width: 100%; max-width: 400px;
      background: var(--surface);
      border-radius: 20px;
      padding: 1.6rem 1.35rem 1.45rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
    }
    .city-picker-sheet h2 {
      font-family: "Noto Serif SC", "Noto Serif JP", serif;
      font-size: 1.28rem; font-weight: 700; line-height: 1.35;
      color: var(--ink); margin-bottom: .35rem;
    }
    .city-picker-sheet p {
      font-size: .84rem; color: var(--sub); line-height: 1.5;
      margin-bottom: 1.15rem;
    }
    .city-picker-lang {
      justify-content: center;
      margin-bottom: 1rem;
    }
    .city-picker-lang button {
      background: var(--bg);
      border-color: var(--line);
      font-size: .68rem;
      padding: .32rem .55rem;
    }
    .city-picker-btns {
      display: grid; grid-template-columns: 1fr; gap: .65rem;
    }
    @media (min-width: 520px) {
      .city-picker-btns { grid-template-columns: 1fr 1fr; }
    }
    .city-picker-btn {
      appearance: none; border: 1.5px solid var(--line);
      border-radius: 14px; background: var(--bg);
      padding: 1.1rem .75rem; cursor: pointer;
      font-family: inherit; text-align: center;
      transition: border-color .15s, background .15s, transform .1s;
    }
    .city-picker-btn:hover, .city-picker-btn:active {
      border-color: var(--brand); background: var(--tag-bg);
      transform: translateY(-1px);
    }
    .city-picker-btn .city-name {
      display: block; font-size: 1.05rem; font-weight: 800;
      color: var(--ink);
    }
  </style>
</head>
<body>

  <!-- ─── 城市选择（首屏） ─────────────────────────────── -->
  <div class="city-picker-overlay" id="city-picker-overlay" role="dialog" aria-modal="true" aria-labelledby="city-picker-title">
    <div class="city-picker-sheet">
      <div class="lang-sw city-picker-lang" id="city-lang-sw" role="group"></div>
      <h2 id="city-picker-title"></h2>
      <p id="city-picker-lead"></p>
      <div class="city-picker-btns">
        <button type="button" class="city-picker-btn" data-city="osaka">
          <span class="city-name" id="city-lbl-osaka"></span>
        </button>
        <button type="button" class="city-picker-btn" data-city="kyoto">
          <span class="city-name" id="city-lbl-kyoto"></span>
        </button>
      </div>
    </div>
  </div>

  <main class="page-main">

  <!-- ─── HERO（地图背景，非粘性，向上滚走后显示搜索栏） ── -->
  <section class="hero">
    <!-- 地图背景层：img + object-fit:cover，保持原图清晰度 -->
    <div class="hero-map" aria-hidden="true">
      <img src="map-bg.png" alt="">
    </div>
    <!-- 渐变遮罩层 -->
    <div class="hero-veil" aria-hidden="true"></div>
    <!-- 内容层 -->
    <div class="hero-inner">
      <div class="hero-top">
        <button type="button" class="loc-btn" id="loc-btn" aria-label="选择位置">
          <span class="loc-pin">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
          </span>
          <span class="loc-label" id="loc-label">选择位置</span>
          <span class="loc-chevron">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
          </span>
        </button>
        <div class="lang-sw" id="lang-sw" role="group"></div>
      </div>
      <h1 id="i-h1"></h1>
      <div class="hero-rule"></div>
      <p class="hero-lead" id="i-lead"></p>
      <p class="hero-dist-note" id="i-dnote"></p>
    </div>
  </section>

  <!-- Google Places Service 挂载点（不可见） -->
  <div id="places-service-el" style="display:none"></div>

  <!-- ─── 地址选择抽屉 ─────────────────────────────────── -->
  <div class="loc-drawer-mask hidden" id="loc-drawer-mask">
    <div class="loc-drawer">
      <div class="loc-drawer-head">
        <h3 id="loc-drawer-title">选择位置</h3>
        <button class="loc-drawer-close" id="loc-drawer-close" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="loc-drawer-body">
        <button class="loc-current-btn" id="loc-current-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
          <span id="loc-current-label">使用当前位置</span>
        </button>
        <div class="loc-search-row">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="color:var(--muted);flex-shrink:0">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="search" id="loc-search-in" autocomplete="off" spellcheck="false" placeholder="搜索地址…">
          <button class="clear-btn" id="loc-clear-btn" hidden type="button" aria-label="清除">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="loc-suggestions" id="loc-suggestions"></div>
      </div>
    </div>
  </div>

  <!-- ─── STICKY：搜索 + 分类胶囊 ──────────────────────── -->
  <div class="controls">
    <div class="search-row">
      <div class="search-box">
        <span class="s-ico">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </span>
        <input type="search" id="search-in" autocomplete="off" spellcheck="false">
        <button class="clear-btn" id="clear-btn" hidden aria-label="清除">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="chips" id="chips" role="tablist"></div>
    <div class="sort-row" id="sort-row"></div>
  </div>

  <!-- ─── 门店卡片 ─────────────────────────────────────── -->
  <div class="cards" id="cards"></div>
  <p class="no-results hidden" id="no-res"></p>

  <footer class="page-footer" id="page-footer">
    <p id="maps-attribution"></p>
  </footer>

  </main>

  <!-- ─── 预约弹层（WhatsApp / LINE / 微信） ──────────────── -->
  <div class="wa-overlay" id="wa-overlay">
    <div class="wa-sheet">
      <div class="wa-sheet-head">
        <p class="wa-store-name" id="wa-store-name"></p>
        <button class="wa-close" id="wa-close" type="button">✕</button>
      </div>

      <!-- 渠道选择 -->
      <div class="plat-row" id="plat-row">
        <button class="plat-btn on" data-plat="whatsapp" type="button">
          WhatsApp<span class="plat-badge" id="pb-rec">★ 推荐</span>
        </button>
        <button class="plat-btn" data-plat="line" type="button">LINE</button>
        <button class="plat-btn" data-plat="wechat" type="button" id="pb-wechat">微信</button>
      </div>

      <!-- 表单（共享） -->
      <div class="wa-fields">
        <div class="wa-field" style="grid-column:1/-1">
          <label id="wa-l-name">姓名</label>
          <input type="text" id="wa-name" autocomplete="name">
        </div>
        <div class="wa-field">
          <label id="wa-l-date">日期</label>
          <input type="date" id="wa-date">
        </div>
        <div class="wa-field">
          <label id="wa-l-time">时间</label>
          <input type="time" id="wa-time">
        </div>
        <div class="wa-field">
          <label id="wa-l-pax">人数</label>
          <input type="number" id="wa-pax" min="1" max="30" value="2">
        </div>
      </div>

      <!-- WhatsApp 操作区 -->

    let v = store[key] ?? 999;
    if (key !== 'orderAll' || activeRegion() !== 'osaka' || sortMode !== 'default' || activeCat !== 'all') {
      return v;
    }
    if (store.id === 'o112') return 1;      // 卡丁车 → 第 1

      if (!stayId) return null;
      return (store.fromStay[stayId] || {})[lang] || null;

    if (activeRegion() === 'osaka' || isOsakaStore(store)) return null;
    if (!stayId) return null;
    return (store.fromStay[stayId]||{})[lang] || null;
  }
  /* 大阪门店 id 以 o 开头（o54–o102）；其余为京都合作门店 */
  function isOsakaStore(store) {
    return /^o\d+$/.test(store.id || '');
  }
  /* 接送机等全区域通用服务 */
  function isSharedStore(store) {
    return store.cat === 'transfer';

  function detectRegionFromCoords(lat, lon) {
    const dOsaka = havKm({ lat, lon }, { lat: 34.6937, lon: 135.5023 });
    const dKyoto = havKm({ lat, lon }, { lat: 35.0116, lon: 135.7681 });
    if (dOsaka != null && dKyoto != null) return dOsaka < dKyoto ? 'osaka' : 'kyoto';
    if (lat >= 34.5 && lat <= 34.9 && lon >= 135.3 && lon <= 135.7) return 'osaka';
    if (lat >= 34.9 && lat <= 35.2 && lon >= 135.55 && lon <= 135.95) return 'kyoto';
    return 'kyoto';
  }
  function detectRegionFromText(text) {
    if (!text) return null;
    const t = String(text);
    if (/大阪|Osaka|Ōsaka|ōsaka/i.test(t)) return 'osaka';
    if (/京都|Kyoto/i.test(t)) return 'kyoto';
    return null;
  }
  function detectRegionFromGeo(geo) {
    if (!geo) return null;
    const blob = [geo.city, geo.state].filter(Boolean).join(' ');
    return detectRegionFromText(blob);
  }
  function activeRegion() {
    const fromGeo = detectRegionFromGeo(serviceGeoInfo);
    if (fromGeo) return fromGeo;
    if (custLoc) {
      const fromName = detectRegionFromText(custLoc.displayName);
      if (fromName) return fromName;
      return detectRegionFromCoords(custLoc.lat, custLoc.lon);
    }
    return 'kyoto';
  }
  function storeMatchesRegion(store, region) {
    if (isSharedStore(store)) return true;
    return region === 'osaka' ? isOsakaStore(store) : !isOsakaStore(store);
  }
  function syncActiveCatForRegion() {
    const region = activeRegion();
    const cats = new Set(['all']);
    STORES.forEach(s => {
      if (storeMatchesRegion(s, region)) cats.add(s.cat);
    });
    if (activeCat !== 'all' && !cats.has(activeCat)) activeCat = 'all';
  }
  /* 逆地理结果 → 城市 / 国家（用于判断是否与门店同城） */
  function parseGeoInfo(revData) {
    if (!revData?.address) return null;
    const a = revData.address;
    return {
      city: a.city || a.city_district || a.county || null,
      state: a.state || null,
      country: a.country || null
    };
  }
  function normCity(c) {
    if (!c) return '';
    return String(c).toLowerCase().replace(/市$/, '').replace(/\s+/g, '').trim();
  }
  function isSameCityRegion(a, b) {
    if (!a || !b) return null;
    if (a.country && b.country && a.country !== b.country) return false;
    const na = normCity(a.city), nb = normCity(b.city);
    if (!na || !nb) return null;
    return na === nb || na.includes(nb) || nb.includes(na);
  }
  /* 「离我最近」模式下：用户与门店不在同一城市时不显示步行/电车时间 */
  function shouldShowTravel(store) {
    if (sortMode !== 'me' || !userPos) return true;
    const km = userKmVal(store);
    if (km != null && km > 30) return false;
    if (userGeoInfo && serviceGeoInfo) {
      const same = isSameCityRegion(userGeoInfo, serviceGeoInfo);
      if (same !== null) return same;
    }
    return km == null || km <= 30;
  }
  function resolveUserGeoInfo(cb) {
    if (!userPos) { cb(null); return; }
    if (userGeoInfo) { cb(userGeoInfo); return; }
    if (typeof googleReverse !== 'function') { cb(null); return; }
    googleReverse(userPos.lat, userPos.lon, data => {
      userGeoInfo = parseGeoInfo(data);
      cb(userGeoInfo);
    });
  }
  function resolveServiceGeoInfo(cb) {
    if (serviceGeoInfo) { cb(serviceGeoInfo); return; }
    const p = refPoint();
    if (!p || typeof googleReverse !== 'function') { cb(null); return; }
    googleReverse(p.lat, p.lon, data => {
      serviceGeoInfo = parseGeoInfo(data);
      cb(serviceGeoInfo);
    });
  }
  function refreshGeoCityContext() {
    resolveUserGeoInfo(() => renderCards());
    resolveServiceGeoInfo(() => renderCards());
  }
  /* Haversine 直线距离 ×1.25 估算实际路程（km，数值） */
  function havKm(a, b) {
    if (!a || !b) return null;
    const R = 6371, rad = d => d * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
    const h = Math.sin(dLat/2)**2 +
              Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h)) * 1.25;
  }
  /* 参考点 → 门店距离（数值 km，排序用） */
  function stayKmVal(store) {
    return havKm(refPoint(), store.storeCoords);
  }
  /* 用户 → 门店距离（数值 km，排序用） */
  function userKmVal(store) {
    return havKm(userPos, store.storeCoords);
  }
  /* 民宿 → 门店距离文本 */
  function distKm(store) {
    const km = stayKmVal(store);
    return km == null ? null : km.toFixed(1) + ' km';
  }

  /* URL：?explore=reset 清空进度；?explore=show 已领券时直接打开弹层 */
  function applyExploreUrlFlags() {
    const u = new URL(location.href);
    const flag = (u.searchParams.get('explore') || '').toLowerCase();
    if (!flag) return '';
    if (flag === 'reset') {
      try { localStorage.removeItem(EXPLORE_LS_KEY); } catch (_) {}
    }
    u.searchParams.delete('explore');
    history.replaceState(null, '', u.pathname + u.search + u.hash);
    return flag;
  }
  const exploreUrlFlag = applyExploreUrlFlags();

  function loadExploreState() {
    try {
      const raw = localStorage.getItem(EXPLORE_LS_KEY);
      if (!raw) return { clicked: [], unlocked: false };
      const data = JSON.parse(raw);
      const clicked = Array.isArray(data.clicked)
        ? data.clicked.filter(id => EXPLORE_CATS.includes(id))
        : [];
      return { clicked, unlocked: !!data.unlocked };
    } catch (_) {
      return { clicked: [], unlocked: false };
    }
  }
  function saveExploreState() {
    try {
      localStorage.setItem(EXPLORE_LS_KEY, JSON.stringify({
        clicked: [...exploreClicked],
        unlocked: exploreUnlocked,

  /* ── 用户定位 ────────────────────────────────────────── */
  function requestUserSort() {
    // 已有定位结果：直接切换排序
    if (userPos) {
      sortMode = 'me';
      renderSort();
      renderCards();
      if (!userGeoInfo || !serviceGeoInfo) refreshGeoCityContext();
      return;
    }
    if (!navigator.geolocation) {
      geoState = 'error';
      alert(L().geoUnsupported);
      return;
    }
    geoState = 'loading';
    renderSort();
    navigator.geolocation.getCurrentPosition(
      pos => {
        userPos     = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        userGeoInfo = null;
        geoState    = 'ok';
        sortMode    = 'me';
        renderSort(); renderCards();
        refreshGeoCityContext();
      },
      () => {
        geoState = 'error';
        renderSort();
        alert(L().geoFail);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  }

  /* ── 门店卡片 ────────────────────────────────────────── */
  function renderCards() {
    $cards.innerHTML = '';
    const u  = L();
    const sq = q.trim().toLowerCase();

    /* 模糊匹配：
       1. 先尝试直接子串（最精确）
       2. 字符级拆分仅对中文启用："送机" → 每个汉字逐一匹配
          （英文/日文假名不拆，避免字母太短造成误命中） */
    function fuzzy(hay, term) {
      if (hay.includes(term)) return true;
      if (term.length >= 2 && /[\u4e00-\u9fff]/.test(term))
        return term.split('').every(ch => hay.includes(ch));
      return false;
    }

    /** 地点文案转义（防 XSS） */
    function escLocHtml(t) {
      return String(t ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
    const region = activeRegion();
    const list = STORES
      .filter(s => {
        if (s.hidden) return false;
        if (!storeMatchesRegion(s, region)) return false;
        if (activeCat !== 'all' && s.cat !== activeCat) return false;
        if (sq) {
          const c        = s[lang];
          const catLabel = (L().cats[s.cat] || '').toLowerCase();
          const hay      = [c.name, c.area, c.desc, ...(c.tags||[]), catLabel].join(' ').toLowerCase();
          return fuzzy(hay, sq);
        }
        return true;
      })
      .sort((a, b) => {
        // 距离排序：stay = 离民宿，me = 离用户；无坐标的门店排在最后
        if (sortMode === 'stay' || (sortMode === 'me' && userPos)) {
          const fn = sortMode === 'stay' ? stayKmVal : userKmVal;
          const da = fn(a), db = fn(b);
          if (da != null || db != null)
            return (da ?? Infinity) - (db ?? Infinity);
        }
        // 默认：全部列表按 orderAll，分类列表按 orderCat，均为手动指定顺序
        const key = activeCat === 'all' ? 'orderAll' : 'orderCat';
        return csSortKey(a, key) - csSortKey(b, key);
      });

    if (!list.length) { $noRes.classList.remove('hidden'); return; }
    $noRes.classList.add('hidden');

    list.forEach(store => {
      const c  = store[lang];
      const tr = shouldShowTravel(store) ? travel(store) : null;
      // 「离我最近」：只显示距用户的距离；其他模式显示距参考点（默认民宿/所选位置）的距离
      let km = null;
      let meTxt = null;
      if (sortMode === 'me' && userPos) {
        const mk = userKmVal(store);
        if (mk != null) meTxt = u.distYou(mk.toFixed(1) + ' km');
      } else {
        km = distKm(store);
      }
      const meta = [tr, km, meTxt].filter(Boolean).map(escLocHtml).join('<span class="card-loc-sep"> · </span>');
      const line1Core = escLocHtml(c.area || '');
      const line1 = meta
        ? (line1Core ? line1Core + '<span class="card-loc-sep"> · </span>' + meta : meta)
        : line1Core;
      const locBodyHtml =
        `<span class="card-loc-body"><span class="card-loc-line1">${line1 || escLocHtml(c.area)}</span></span>`;

      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.cat = store.cat;
      card.dataset.storeId = store.id || '';

      const tagsHtml = (c.tags||[]).map(t => `<span class="tag">${t}</span>`).join('');
      const recHtml  = store.rec ? `<span class="rec-badge">${u.rec}</span>` : '';

      // 多格式图片：无后缀时自动尝试 webp → jpg → png；有后缀或 URL 则直接使用
      function imgTag(src, alt) {
        if (!src) return '';
        const hasExt = /\.(jpe?g|png|webp|gif|avif)$/i.test(src);
        const isUrl  = /^https?:\/\//.test(src);
        if (hasExt || isUrl) {
          return `<img class="card-img" src="${src}" alt="${alt}" loading="lazy" onerror="this.style.display='none'">`;
        }
        // 无后缀：级联尝试 webp → jpg → png → 隐藏（目标格式为 webp）
        return `<img class="card-img" src="${src}.webp" alt="${alt}" loading="lazy" ` +
          `onerror="this.src='${src}.jpg';this.onerror=function(){this.src='${src}.png';this.onerror=function(){this.style.display='none';}}">`;
      }

      card.innerHTML =
        `<div class="card-img-wrap">` +
          imgTag(store.img, c.name) +
        `</div>` +
        `<div class="card-body">` +
          `<div class="card-row1">` +
            `<h2 class="card-name">${c.name}</h2>${recHtml}` +
          `</div>` +
          `<p class="card-loc">` +
            `<span class="card-loc-ico">` +
            `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>` +
            `</span>` +
            `<span class="card-loc-txt">${locBodyHtml}</span>` +
          `</p>` +
          `<p class="card-desc">${c.desc}</p>` +
          `<div class="card-tags">${tagsHtml}</div>` +
          `<div class="card-footer">` +
            `<span class="card-hours">` +
              `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>` +
              `&nbsp;${c.hours}` +
            `</span>` +
            `<button type="button" class="book-btn" data-book>` +
              `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>` +
              `${u.book}` +
            `</button>` +
          `</div>` +
        `</div>`;

      $cards.appendChild(card);
    });

    /* 底部「加入推荐清单」入口（固定在列表最后，不参与筛选） */
    const join = document.createElement('div');
    join.className = 'join-card';
    join.innerHTML =
      `<h3>${u.joinT}</h3><p>${u.joinD}</p>` +
      `<button type="button" class="join-btn">` +
        `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>` +
        `${u.joinBtn}` +
      `</button>`;
    join.querySelector('.join-btn').addEventListener('click', () =>
      window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(u.joinMsg)}`, '_blank'));
    $cards.appendChild(join);
  }

  /* ── 事件 ────────────────────────────────────────────── */

  /* ── Google API Key ─────────────────────────────────── */

  /* ── 加载 Google Maps JS API ───────────────────────── */
  let gmapsLoaded = false;
  let gmapsLoading = null;
  function loadGmaps() {
    if (gmapsLoaded && window.google?.maps) return Promise.resolve();
    if (gmapsLoading) return gmapsLoading;
    if (!gApiKey) return Promise.reject(new Error('No API key'));
    gmapsLoading = new Promise((resolve, reject) => {
      const old = document.getElementById('gmaps-script');
      if (old) old.remove();
      gmapsLoaded = false;
      const s = document.createElement('script');
      s.id = 'gmaps-script';
      s.src = `https://maps.googleapis.com/maps/api/js?key=${gApiKey}&libraries=places`;
      s.async = true;
      s.onload = () => { gmapsLoaded = true; gmapsLoading = null; resolve(); };
      s.onerror = () => { gmapsLoading = null; gmapsLoaded = false; reject(new Error('Google Maps load failed')); };
      document.head.appendChild(s);
    });
    return gmapsLoading;
  }

  function gPlaceResult(p) {
    return {
      lat: p.geometry.location.lat(),
      lon: p.geometry.location.lng(),
      display_name: p.name + ', ' + (p.formatted_address || p.vicinity || '')
    };
  }

  function gGeocodeResult(r) {
    const byType = {};
    (r.address_components || []).forEach(c => c.types.forEach(t => byType[t] = c.long_name));
    return {
      display_name: r.formatted_address,
      address: {
        road: byType.route,
        neighbourhood: byType.neighborhood || byType.sublocality_level_2,
        suburb: byType.sublocality || byType.locality,
        city_district: byType.administrative_area_level_2,
        city: byType.locality || byType.administrative_area_level_1,
        state: byType.administrative_area_level_1,
        county: byType.administrative_area_level_2,
        country: byType.country
      }
    };
  }

  function googlePlacesSearch(query, cb) {
    if (!gApiKey) { cb([]); return; }
    loadGmaps().then(() => {
      if (window.google?.maps?.places?.AutocompleteService) {
        const svc = new google.maps.places.AutocompleteService();
        svc.getQueryPredictions(
          { input: query, language: lang },
          (predictions, st) => {
            if (st === 'OK' && predictions && predictions.length) {
              cb(predictions.map(p => ({
                place_id: p.place_id,
                display_name: p.description,
                main_text: (p.structured_formatting && p.structured_formatting.main_text) || p.description.split(',')[0],
                secondary_text: (p.structured_formatting && p.structured_formatting.secondary_text) || p.description.split(',').slice(1).join(',').trim(),
                lat: null, lon: null, _pending: true
              })));
            } else if (st === 'ZERO_RESULTS') {
              cb([]);
            } else {
              geocodeFallback(query, cb);
            }
          });
      } else {
        geocodeFallback(query, cb);
      }
    }).catch(() => cb([]));
  }

  function geocodeFallback(query, cb) {
    new google.maps.Geocoder().geocode(
      { address: query, language: lang, region: 'jp' },
      (gres, gst) => {
        if (gst === 'OK' && gres) {
          cb(gres.map(r => ({
            lat: r.geometry.location.lat(),
            lon: r.geometry.location.lng(),
            display_name: r.formatted_address,
            _pending: false
          })));
        } else {
          cb([]);
        }
      });
  }

  function geocodePlaceId(placeId, cb) {
    loadGmaps().then(() => {
      new google.maps.Geocoder().geocode(
        { placeId: placeId, language: lang, region: 'jp' },
        (results, st) => {
          if (st === 'OK' && results && results[0]) {
            cb({
              lat: results[0].geometry.location.lat(),
              lon: results[0].geometry.location.lng()
            });
          } else { cb(null); }
        });
    }).catch(() => cb(null));
  }

  function googleReverse(lat, lon, cb) {
    if (!gApiKey) { cb(null); return; }
    loadGmaps().then(() => {
      new google.maps.Geocoder().geocode(
        { location: { lat: lat, lng: lon }, language: lang, region: 'jp' },
        (results, st) => { cb(st === 'OK' && results[0] ? gGeocodeResult(results[0]) : null); }
      );
    }).catch(() => cb(null));
  }

  function googleNearbySearch(lat, lon, cb) {
    if (!gApiKey) { cb([]); return; }
    loadGmaps().then(() => {
      new google.maps.places.PlacesService($placesEl)
        .nearbySearch({
          location: new google.maps.LatLng(lat, lon),
          radius: 1000, language: lang
        }, (results, st) => {
          cb(st === 'OK' && results ? results.map(gPlaceResult) : []);
        });
    }).catch(() => cb([]));
  }

            displayName: item.main_text
          });
        }
      });
      $locSugs.appendChild(el);
    });
  }

  function renderLocNearbyList(lat, lon, revName, nearbyList) {
    const u = L();
    $locSugs.innerHTML = '';

    const revNameLC = revName.toLowerCase();
    const filtered = (nearbyList || []).filter(item => {
      const itemName = (item.display_name || '').split(',')[0].trim().toLowerCase();
      return itemName && itemName !== revNameLC &&
             !revNameLC.includes(itemName) && !itemName.includes(revNameLC);
    });

    const seen = new Set();
    const deduped = [];
    filtered.forEach(item => {
      const key = (item.display_name || '').split(',').slice(0, 2).join(',').trim().toLowerCase();
      if (!seen.has(key)) { seen.add(key); deduped.push(item); }
    });

    const curEl = document.createElement('div');
    curEl.className = 'loc-suggestion loc-suggestion-current';
    curEl.innerHTML =
      `<span class="loc-sug-pin" style="color:var(--brand)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--brand)" stroke="var(--brand)" stroke-width="1.5"><circle cx="12" cy="12" r="2"/><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
      </span>
      <span>

        <span class="loc-sug-name">${escHtml(revName)}</span>
      </span>`;
    curEl.addEventListener('click', () => selectCustomLocation({
      lat, lon, displayName: revName.split(',')[0] || revName
    }));
    $locSugs.appendChild(curEl);

    if (deduped.length) {
      const sep = document.createElement('div');
      sep.className = 'loc-nearby-sep';
      sep.textContent = u.locNearbyTitle;
      $locSugs.appendChild(sep);

      deduped.forEach(item => {
        const name = (item.display_name || '').split(',')[0].trim();
        const addr = (item.display_name || '').split(',').slice(1).join(',').trim();
        const el = document.createElement('div');
        el.className = 'loc-suggestion';
        el.innerHTML =
          `<span class="loc-sug-pin">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="2"/></svg>
          </span>
          <span>
            <span class="loc-sug-addr">${escHtml(name)}</span>
            <span class="loc-sug-name">${escHtml(addr)}</span>
          </span>`;
        el.addEventListener('click', () => selectCustomLocation({
          lat: parseFloat(item.lat),
          lon: parseFloat(item.lon),
          displayName: name
        }));
        $locSugs.appendChild(el);
      });
    }
  }

      document.getElementById('pb-rec').textContent    = ui.rec;
      document.getElementById('line-hint').textContent  = ui.lineHint;
      document.getElementById('wechat-hint').textContent= ui.wechatHint;
      document.getElementById('copy-line').textContent  = ui.copyBtn;
      document.getElementById('copy-wechat').textContent= ui.copyBtn;
      document.getElementById('wechat-qr-toggle').textContent = ui.showQR;
      document.getElementById('line-qr-toggle').textContent   = ui.showQR;
      document.getElementById('wechat-qr-tip').textContent    = ui.qrTip;
      document.getElementById('line-qr-tip').textContent      = ui.qrTip;
      // 默认日期 = 明天
      const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
      document.getElementById('wa-date').value = tmr.toISOString().slice(0, 10);
      document.getElementById('wa-time').value = '19:00';
      document.getElementById('wa-pax').value  = '2';
      switchPlat('whatsapp');
      $waOverlay.classList.add('open');
    }

    /* ── 关闭 ────────────────────────────────────────── */
    document.getElementById('wa-close').addEventListener('click', () =>
      $waOverlay.classList.remove('open'));
    $waOverlay.addEventListener('click', e => {
      if (e.target === $waOverlay) $waOverlay.classList.remove('open');
    });

    /* ── 渠道切换按钮 ────────────────────────────────── */
    document.getElementById('plat-row').addEventListener('click', e => {
      const b = e.target.closest('.plat-btn');
      if (b) switchPlat(b.dataset.plat);
    });

    /* ── WhatsApp 发送 ───────────────────────────────── */
    document.getElementById('wa-submit-btn').addEventListener('click', () => {
      const msg = buildMsg();
      if (typeof __csTrack === 'function') {
        __csTrack({
          action: 'click',
          btn: 'wa-book',
          label: (clientId ? clientId + ':' : '') + (waStoreName || 'book')
        });
      }
      window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
    });

    /* ── 复制信息 ────────────────────────────────────── */
    function setupCopy(btnId, msgId) {
      document.getElementById(btnId).addEventListener('click', () => {
        const text = document.getElementById(msgId).value;
        const ui   = BOOK_UI[lang] || BOOK_UI.zh;
        const btn  = document.getElementById(btnId);
        navigator.clipboard?.writeText(text).catch(() => {
          const ta = document.getElementById(msgId);
          ta.select(); document.execCommand('copy');
        });
        btn.textContent = ui.copied;
        btn.classList.add('ok');
        setTimeout(() => { btn.textContent = ui.copyBtn; btn.classList.remove('ok'); }, 2000);
      });
    }
    setupCopy('copy-line',   'msg-line');
    setupCopy('copy-wechat', 'msg-wechat');

    /* ── 二维码展开（LINE / 微信共用） ──────────────────── */
    function setupQRToggle(btnId, wrapId) {
      document.getElementById(btnId)?.addEventListener('click', () => {
        const wrap = document.getElementById(wrapId);
        const ui   = BOOK_UI[lang] || BOOK_UI.zh;
        const btn  = document.getElementById(btnId);
        const show = wrap.classList.toggle('show');
        btn.textContent = show ? ui.hideQR : ui.showQR;
      });
    }
    setupQRToggle('line-qr-toggle',  'line-qr-wrap');
    setupQRToggle('wechat-qr-toggle','qr-wrap');

    /* ── 表单变动时刷新预览 ──────────────────────────── */
    ['wa-name','wa-date','wa-time','wa-pax'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        if (curPlat === 'line' || curPlat === 'wechat') refreshPreview();
      });
    });

    /* ── 卡片预约按钮 ────────────────────────────────── */
    $cards.addEventListener('click', e => {
      const btn = e.target.closest('[data-book]');
      if (!btn) return;
      const card = btn.closest('.card');
      const storeName = card?.querySelector('.card-name')?.textContent?.trim() || '';
      const storeId = card?.dataset?.storeId || 'unknown';
      if (window.__csTrack) {
        window.__csTrack({ action: 'click', btn: 'book-' + storeId, label: storeName });
      }
      openBookModal(storeName);
    });
    $btnCta.addEventListener('click', () => {
      if (window.__csTrack) {
        window.__csTrack({ action: 'click', btn: 'cta-bottom', label: L().cta });
      }
      openBookModal('');
    });


  /* ── 初始化 ──────────────────────────────────────────── */
  let pageReady = false;

  function finishPageInit() {
    if (pageReady) return;
    pageReady = true;
    renderChrome(); renderLang(); renderChips(); renderSort(); renderCards();
    if (exploreUnlocked && exploreUrlFlag === 'show') showCouponToast();
    else syncCouponEntry();
    resolveServiceGeoInfo(() => {
      syncActiveCatForRegion();
      renderChips();
      renderCards();
    });
  }

  document.documentElement.lang = lang==='zh' ? 'zh-CN' : lang==='ja' ? 'ja' : 'en';
  renderLang();
  const savedCity = detectSavedCity();
  if (savedCity) {
    applyCityPreset(savedCity);
    finishPageInit();
  } else {
    openCityPicker();
  }
})();
</script>

</body>
</html>
