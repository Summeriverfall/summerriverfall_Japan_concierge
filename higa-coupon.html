<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>领取探索优惠券</title>
  <script>
  (function () {
    var ENDPOINT = 'https://script.google.com/macros/s/AKfycbzSD362gcahdmKAWhiYyiPfEXeYnm0SXfBsTJIKx1g7pkMTogd7EtG0O59Gs_rEsX8/exec';
    window.__CS_STATS_ENDPOINT = ENDPOINT;
    var _client = 'onya';
    window.__CS_CLIENT = _client;
    var _page = 'higa-coupon';
    var _qs = new URLSearchParams(location.search);
    var _lang = (_qs.get('lang') || '').toLowerCase();
    if (_lang.indexOf('zh') === 0) _lang = 'zh';
    else if (_lang.indexOf('ja') === 0) _lang = 'ja';
    else if (_lang.indexOf('en') === 0) _lang = 'en';
    else {
      try { _lang = localStorage.getItem('bnbHubLang') || ''; } catch (e) { _lang = ''; }
    }
    if (_lang !== 'zh' && _lang !== 'en' && _lang !== 'ja') _lang = 'zh';
    window.__CS_LANG = _lang;
    document.documentElement.lang = _lang === 'zh' ? 'zh-CN' : _lang === 'ja' ? 'ja' : 'en';
    window.__csTrack = function (opts) {
      if (!ENDPOINT) return;
      opts = opts || {};
      var parts = [
        'action=' + encodeURIComponent(opts.action || 'hit'),
        'page=' + encodeURIComponent(_page),
        'lang=' + encodeURIComponent(document.documentElement.lang || 'zh-CN'),
        'client=' + encodeURIComponent(_client)
      ];
      if (opts.action === 'hit' || !opts.action) {
        parts.push('title=' + encodeURIComponent(String(opts.title || document.title || '').slice(0, 120)));
      }
      if (opts.btn) parts.push('btn=' + encodeURIComponent(String(opts.btn).slice(0, 64)));
      if (opts.label) parts.push('label=' + encodeURIComponent(String(opts.label).slice(0, 120)));
      new Image().src = ENDPOINT + '?' + parts.join('&');
    };
    __csTrack({ action: 'hit', title: 'onya · coupon-page' });
    __csTrack({ action: 'click', btn: 'explore-form', label: 'coupon-page' });
  })();
  </script>
  <script>window.__CS_COUPON_SOURCE = 'local';</script>
  <script src="coupons-local.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg: #f5f9f7;
      --ink: #14221f;
      --sub: #4e6560;
      --muted: #8fa39e;
      --line: #e2ebe8;
      --brand: #0f766e;
      --brand-dk: #134e4a;
      --tag-bg: #e2efed;
      --safe-b: max(1rem, env(safe-area-inset-bottom));
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(15,118,110,.12), transparent 55%),
        radial-gradient(900px 420px at 100% 0%, rgba(20,184,166,.1), transparent 50%),
        var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans", sans-serif;
      padding: 1.25rem 1rem calc(1.5rem + var(--safe-b));
    }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      gap: .75rem; margin-bottom: 1rem;
    }
    .back {
      display: inline-flex; align-items: center; gap: .3rem;
      color: var(--brand); text-decoration: none;
      font-size: .82rem; font-weight: 650;
    }
    .lang-sw { display: flex; gap: .15rem; flex-shrink: 0; }
    .lang-sw button {
      border: 1px solid var(--line); background: #fff; color: var(--sub);
      border-radius: 8px; padding: .28rem .45rem; font: inherit;
      font-size: .68rem; font-weight: 700; cursor: pointer;
    }
    .lang-sw button.on {
      background: var(--brand); border-color: var(--brand); color: #fff;
    }
    .wrap { max-width: 420px; margin: 0 auto; }
    .card {
      position: relative;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 1.25rem 1.1rem 1.15rem;
      box-shadow: 0 12px 32px rgba(20,34,31,.1);
    }
    .card::before {
      content: '';
      position: absolute; left: 14px; right: 14px; top: 0;
      height: 3px; border-radius: 0 0 3px 3px;
      background: linear-gradient(90deg, #f0b429, #0f766e);
    }
    .eyebrow {
      margin: 0; font-size: .7rem; font-weight: 800;
      letter-spacing: .08em; color: #b45309; text-transform: uppercase;
    }
    h1 {
      margin: .35rem 0 .4rem;
      font-family: "Noto Serif SC", "Noto Serif JP", serif;
      font-size: 1.35rem; font-weight: 700; color: var(--brand-dk);
      line-height: 1.3;
    }
    .lead { margin: 0 0 .9rem; font-size: .82rem; color: var(--sub); line-height: 1.5; }
    .offer {
      display: grid; gap: 0;
      margin: 0 0 .9rem; padding: .15rem 0;
      border-radius: 12px;
      background: linear-gradient(160deg, #f0faf8, #fffbeb);
      border: 1px solid #d8ebe6;
      overflow: hidden;
    }
    .offer-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: .5rem; padding: .7rem .85rem;
      font-size: .78rem; color: var(--sub);
    }
    .offer-row + .offer-row {
      border-top: 1px dashed rgba(15,118,110,.18);
    }
    .offer-row .route {
      display: flex; flex-direction: column; gap: .12rem; min-width: 0;
    }
    .offer-row .route .city {
      font-weight: 800; color: var(--brand-dk); font-size: .88rem;
    }
    .offer-row .route .sub {
      font-size: .7rem; color: var(--muted); font-weight: 550;
    }
    .offer-row .val {
      flex-shrink: 0;
      font-weight: 800; font-size: 1.12rem; color: #b45309;
      font-variant-numeric: tabular-nums;
    }
    .code {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1rem; padding: .7rem;
      border-radius: 12px;
      background: #fffbeb;
      border: 1.5px dashed #f0b429;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 1.2rem; font-weight: 800; letter-spacing: .12em;
      color: var(--brand-dk);
    }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem .55rem; margin-bottom: .85rem; }
    .field { display: flex; flex-direction: column; gap: .25rem; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: .72rem; font-weight: 700; color: var(--brand-dk); }
    .field input {
      width: 100%; padding: .55rem .6rem; border-radius: 10px;
      border: 1.5px solid var(--line); background: #fff;
      font: inherit; font-size: .85rem; color: var(--ink);
    }
    .field input:focus {
      outline: none; border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15,118,110,.15);
    }
    .field input.err { border-color: #dc2626; }
    .preview {
      margin-bottom: .85rem; border-radius: 12px;
      border: 1px solid var(--line); overflow: hidden; background: #fff;
    }
    .preview-head {
      display: flex; align-items: center; gap: .4rem;
      padding: .5rem .7rem; background: var(--tag-bg);
      border-bottom: 1px solid var(--line);
      font-size: .74rem; font-weight: 700; color: var(--brand-dk);
    }
    .preview-head svg { width: 15px; height: 15px; fill: #1E8E4F; }
    .preview-body {
      display: none; margin: 0; padding: .75rem .8rem;
      font-size: .8rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    }
    .preview-hint {
      margin: 0; padding: .75rem .8rem;
      font-size: .78rem; color: var(--muted); font-style: italic;
    }
    .preview.ready .preview-body { display: block; }
    .preview.ready .preview-hint { display: none; }
    .submit {
      display: flex; align-items: center; justify-content: center; gap: .45rem;
      width: 100%; padding: .85rem; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #0f766e, #134e4a);
      color: #fff; font: inherit; font-size: .9rem; font-weight: 800;
      box-shadow: 0 10px 22px rgba(15,118,110,.28); cursor: pointer;
    }
    .submit:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
    .submit svg { width: 16px; height: 16px; fill: currentColor; }
  </style>
</head>

  <script>
  (function () {
    const WA_NUM = '85290744644';
    const CLIENT = 'onya';
    const LANGS = ['zh', 'en', 'ja'];
    const LANG_LBL = { zh: '中文', en: 'EN', ja: '日本語' };
    const HOTEL = {
      zh: '民宿御屋（Onya）',
      en: 'Onya Guesthouse',
      ja: '民宿御屋（Onya）',
    };
    let couponCode = (typeof __csGetCachedCoupon === 'function' && __csGetCachedCoupon()) || '';
    const UI = {
      zh: {
        titleDoc: '领取探索优惠券',
        back: '← 返回体验页',
        eyebrow: '老客专属',
        title: '接送机专属报价',
        desc: '作为预约客户，可按行程选择大阪或京都机场接送。填写信息后通过 WhatsApp 领取。',
        offerOsakaCity: '大阪',
        offerOsakaSub: '机场接送',
        offerKyotoCity: '京都',
        offerKyotoSub: '机场接送',
        lName: '姓名 *',
        lDate: '日期',
        lPax: '人数',
        previewTitle: 'WhatsApp 消息预览',
        previewHint: '请先填写姓名，即可预览发送内容。',
        submit: '通过 WhatsApp 领取',
        redirecting: '跳转中…',
        msg: (code, hotel, client, name, date, pax) =>
          `您好，我想领取探索奖励优惠券。\n优惠券码：${code}\n客户：${hotel}\n客户代码：${client}\n姓名：${name}\n日期：${date}\n人数：${pax}\n请帮我兑换，谢谢！`,
      },
      en: {
        titleDoc: 'Claim explore coupon',
        back: '← Back to experiences',
        eyebrow: 'Returning guest offer',
        title: 'Airport transfer rates',
        desc: 'As a returning guest, choose Osaka or Kyoto airport transfer at the rates below. Fill in your details to redeem via WhatsApp.',
        offerOsakaCity: 'Osaka',
        offerOsakaSub: 'Airport transfer',
        offerKyotoCity: 'Kyoto',
        offerKyotoSub: 'Airport transfer',
        lName: 'Name *',
        lDate: 'Date',
        lPax: 'Guests',
        previewTitle: 'WhatsApp message preview',
        previewHint: 'Enter your name to preview the message.',
        submit: 'Redeem via WhatsApp',
        redirecting: 'Redirecting…',
        msg: (code, hotel, client, name, date, pax) =>
          `Hello, I'd like to redeem my explore-reward coupon.\nCoupon: ${code}\nGuest: ${hotel}\nClient ID: ${client}\nName: ${name}\nDate: ${date}\nGuests: ${pax}\nPlease help me redeem it. Thank you!`,
      },
      ja: {
        titleDoc: '探索クーポンを受け取る',
        back: '← 体験ページへ戻る',
        eyebrow: 'ご予約のお客様限定',
        title: '空港送迎の特別料金',
        desc: 'ご予約のお客様は、大阪または京都の空港送迎を下記料金でご利用いただけます。情報を入力して WhatsApp で受け取ります。',
        offerOsakaCity: '大阪',
        offerOsakaSub: '空港送迎',
        offerKyotoCity: '京都',
        offerKyotoSub: '空港送迎',
        lName: 'お名前 *',
        lDate: '日付',
        lPax: '人数',
        previewTitle: 'WhatsApp メッセージプレビュー',
        previewHint: 'お名前を入力すると送信内容をプレビューできます。',
        submit: 'WhatsApp で受け取る',
        redirecting: '移動中…',
        msg: (code, hotel, client, name, date, pax) =>
          `こんにちは。探索ボーナスのクーポンを受け取りたいです。\nクーポンコード：${code}\nお客様：${hotel}\n顧客コード：${client}\nお名前：${name}\n日付：${date}\n人数：${pax}\nクーポンの交換をお願いします。`,
      },
    };

    const qs = new URLSearchParams(location.search);
    let lang = window.__CS_LANG || 'zh';
    if (!UI[lang]) lang = 'zh';

    const fromRaw = (qs.get('from') || 'higa-test-page.html').replace(/[^\w./-]/g, '');
    const from = fromRaw || 'higa-test-page.html';

    const $back = document.getElementById('back-link');
    const $langSw = document.getElementById('lang-sw');
    const $name = document.getElementById('name');
    const $date = document.getElementById('date');
    const $pax = document.getElementById('pax');
    const $preview = document.getElementById('preview');
    const $body = document.getElementById('preview-body');
    const $submit = document.getElementById('submit');
    const $submitText = document.getElementById('submit-text');

    document.getElementById('code').textContent = couponCode || '…';
    const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
    $date.value = tmr.toISOString().slice(0, 10);

    function L() { return UI[lang] || UI.zh; }

    function claimCode(done) {
      done = done || function () {};
      if (couponCode) {
        document.getElementById('code').textContent = couponCode;
        done(null, couponCode);
        return;
      }
      if (typeof __csClaimCoupon !== 'function') {
        document.getElementById('code').textContent = '—';
        done(new Error('no helper'), null);
        return;
      }
      __csClaimCoupon({ client: CLIENT, page: 'higa-coupon' }, function (err, res) {
        if (err || !res || !res.code) {
          document.getElementById('code').textContent = '—';
          done(err || new Error('empty'), null);
          return;
        }
        couponCode = res.code;
        document.getElementById('code').textContent = couponCode;
        refresh();
        done(null, couponCode);
      });
    }

    function syncBackHref() {
      const u = new URL(from, location.href);
      u.searchParams.set('lang', lang);
      $back.href = u.pathname.split('/').pop() + u.search + (u.hash || '');
    }

    function applyUI() {
      const u = L();
      document.title = u.titleDoc;
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang === 'ja' ? 'ja' : 'en';
      $back.textContent = u.back;
      syncBackHref();
      document.getElementById('eyebrow').textContent = u.eyebrow;
      document.getElementById('title').textContent = u.title;
      document.getElementById('desc').textContent = u.desc;
      document.getElementById('offer-osaka-city').textContent = u.offerOsakaCity;
      document.getElementById('offer-osaka-sub').textContent = u.offerOsakaSub;
      document.getElementById('offer-kyoto-city').textContent = u.offerKyotoCity;
      document.getElementById('offer-kyoto-sub').textContent = u.offerKyotoSub;
      document.getElementById('l-name').textContent = u.lName;
      document.getElementById('l-date').textContent = u.lDate;
      document.getElementById('l-pax').textContent = u.lPax;
      document.getElementById('preview-title').textContent = u.previewTitle;
      document.getElementById('preview-hint').textContent = u.previewHint;
      if ($submitText.dataset.redirecting !== '1') $submitText.textContent = u.submit;
      $langSw.innerHTML = '';
      LANGS.forEach(code => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = LANG_LBL[code];
        b.className = code === lang ? 'on' : '';
        b.setAttribute('aria-pressed', String(code === lang));
        b.addEventListener('click', () => setLang(code));
        $langSw.appendChild(b);
      });
      refresh();
    }

    function setLang(next) {
      if (!UI[next] || next === lang) return;
      lang = next;
      try { localStorage.setItem('bnbHubLang', lang); } catch (_) {}
      const u = new URL(location.href);
      u.searchParams.set('lang', lang);
      history.replaceState(null, '', u);
      applyUI();
    }

    function buildMsg() {
      const u = L();
      const name = ($name.value || '').trim() || '—';
      const date = $date.value || '—';
      const pax = $pax.value || '—';
      return u.msg(couponCode || '—', HOTEL[lang] || HOTEL.zh, CLIENT, name, date, pax);
    }

    function refresh() {
      const u = L();
      const ok = !!($name.value || '').trim();
      $preview.classList.toggle('ready', ok);
      $body.textContent = ok ? buildMsg() : '';
      $submit.disabled = !ok;
      $name.classList.toggle('err', false);
      if ($submitText.dataset.redirecting !== '1') $submitText.textContent = u.submit;
    }

    ['input', 'change'].forEach(ev => {
      $name.addEventListener(ev, refresh);
      $date.addEventListener(ev, refresh);
      $pax.addEventListener(ev, refresh);
    });

    $submit.addEventListener('click', () => {
      if (!($name.value || '').trim()) {
        $name.classList.add('err'); $name.focus(); return;
      }
      claimCode(function (err) {
        if (err || !couponCode) return;
        const u = L();
        const url = `https://wa.me/${WA_NUM}?text=${encodeURIComponent(buildMsg())}`;
        if (typeof __csTrack === 'function') {
          __csTrack({ action: 'click', btn: 'coupon-wa', label: couponCode });
        }
        $submit.disabled = true;
        $submitText.dataset.redirecting = '1';
        $submitText.textContent = u.redirecting;
        setTimeout(() => {
          window.open(url, '_blank');
          $submitText.dataset.redirecting = '';
          $submitText.textContent = u.submit;
          $submit.disabled = !($name.value || '').trim();
        }, 400);
      });
    });

    try { localStorage.setItem('bnbHubLang', lang); } catch (_) {}
    applyUI();
    claimCode();
  })();
  </script>
