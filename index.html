<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concierge 测试入口</title>
  <style>
    :root { --brand:#0f766e; --brand-dk:#134e4a; --bg:#f5f9f7; }
    body {
      margin: 0; min-height: 100dvh; font-family: system-ui, "PingFang SC", sans-serif;
      background: radial-gradient(900px 400px at 20% 0%, rgba(15,118,110,.12), transparent), var(--bg);
      color: #14221f; padding: 2rem 1.25rem;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.35rem; color: var(--brand-dk); margin: 0 0 .5rem; }
    p { color: #4e6560; font-size: .9rem; line-height: 1.5; }
    a.card {
      display: block; margin: .75rem 0; padding: 1rem 1.1rem;
      background: #fff; border: 1.5px solid rgba(15,118,110,.25);
      border-radius: 14px; text-decoration: none; color: inherit;
      box-shadow: 0 8px 20px rgba(15,118,110,.08);
    }
    a.card strong { display: block; color: var(--brand); margin-bottom: .25rem; }
    a.card span { font-size: .8rem; color: #4e6560; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Concierge 探索领券测试</h1>
    <p>两个版本可对比效果。Sheet 里用 page / btn 区分漏斗。</p>
    <a class="card" href="higa-test.html">
      <strong>A. 弹窗领券版</strong>
      <span>点满 3 类后右下角弹窗填写并跳 WhatsApp</span>
    </a>
    <a class="card" href="higa-test-page.html">
      <strong>B. 独立页领券版</strong>
      <span>点满 3 类后跳转到单独领券页</span>
    </a>
    <p style="font-size:.78rem;margin-top:1.2rem">
      重置 A：<code>?explore=reset</code> 加在 higa-test.html<br>
      重置 B：加在 higa-test-page.html
    </p>
  </div>
</body>
</html>
